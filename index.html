<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ポートフォリオ</title>

<style>
  /* ===== 全体 ===== */
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    line-height: 1.7;
    background-color: #0f172a;
    color: #e5e7eb;
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 20px;
  }

  /* ===== ヒーロー ===== */
  .hero {
    background: linear-gradient(135deg, #1e293b, #0ea5e9);
    text-align: center;
    padding: 80px 20px;
  }

  .hero h1 {
    margin: 0;
    font-size: 2.2rem;
    border: none;
  }

  .hero p {
    margin-top: 10px;
    opacity: 0.9;
  }

  /* ===== 見出し ===== */
  h2 {
    margin-top: 50px;
    border-left: 4px solid #38bdf8;
    padding-left: 10px;
  }

  /* ===== スキル ===== */
  ul {
    padding-left: 20px;
  }

  /* ===== 作品グリッド ===== */
  .project-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 24px;
    margin-top: 30px;
  }

  /* ===== 作品カード ===== */
  .project-card {
    background: #1f2937;
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    transition: transform 0.2s ease;
  }

  .project-card:hover {
    transform: translateY(-6px);
  }

  /* 画像 */
  .project-card img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    display: block;
  }

  /* 本文エリア */
  .project-body {
    padding: 20px;
  }

  .project-card h3 {
    margin-top: 0;
  }

  .label {
    font-weight: bold;
  }

  /* GitHubリンク */
  .project-link {
    display: inline-block;
    margin-top: 12px;
    color: #38bdf8;
    text-decoration: none;
    font-weight: bold;
  }

  .project-link:hover {
    text-decoration: underline;
  }

  /* ===== フッター余白 ===== */
  .spacer {
    height: 40px;
  }
</style>
</head>

<body>

<!-- ===== ヒーロー ===== -->
<section class="hero">
  <h1>浦部 翔｜ゲームプログラマー</h1>
  <p>C++ / DirectX / Unity / UE5 を用いたゲーム制作</p>
</section>

<div class="container">

  <!-- ===== スキル ===== -->
  <h2>スキル</h2>
  <ul>
    <li>C#, C++</li>
    <li>DirectX11</li>
    <li>Unreal Engine 5</li>
  </ul>
  
  <!-- ===== 資格 ===== -->
  <h2>取得資格</h2>
  <ul>
    <li>実用英語技能検定２級</li>
    <li>基本情報技術者試験</li>
    <li>CGエンジニア検定ベーシック</li>
  </ul>
  
  <!-- ===== 作品 ===== -->
  <h2>作品</h2>

  <div class="project-grid">

    <div class="project-card">

      <!-- 画像（ここにスクショ） -->
      <img src="images/MusouTD.png" alt="無双風3Dゲーム">

      <div class="project-body">
        <h3>無双風3Dゲーム</h3>

        <p><span class="label">制作人数：</span>1人</p>
        <p><span class="label">使用技術：</span>C++ / DirectX11</p>

        <p>
          大量のオブジェクトを一斉に描画するため、
          インスタンシングを用いて描画負荷を削減しました。
        </p>

        <!-- GitHubリンク -->
        <a class="project-link"
           href="https://github.com/ShowU1510/MusouTD3DGame"
           target="_blank">
          GitHubを見る →
        </a>
      </div>

    </div>

  </div>

  <div class="spacer"></div>
</div>

</body>
</html>
